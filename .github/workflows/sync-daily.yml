name: Daily Market Sync

on:
  schedule:
    # Läuft jeden Dienstag bis Samstag um 04:00 Uhr UTC
    # (Damit ist der US-Markt definitiv geschlossen und alle Daten vom Vortag sind bei Polygon bereit)
    - cron: '0 4 * * 2-6'
  
  # Dieser geniale Befehl erlaubt es dir, das Skript jederzeit MANUELL über die GitHub-Webseite zu starten!
  workflow_dispatch: 

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Pakete installieren
        run: npm install

      - name: Daily Sync ausführen
        run: node sync-daily.js
        env:
          # Hier ziehen wir die sicheren Keys aus den GitHub Secrets
          POLYGONIO_API_KEY: ${{ secrets.POLYGONIO_API_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
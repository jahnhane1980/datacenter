name: Daily Market Sync

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Läuft jeden Dienstag bis Samstag um 06:47 Uhr UTC (08:47 Uhr MESZ)
    - cron: '47 6 * * 2-6'
  
  # Erlaubt den manuellen Start über die GitHub-Oberfläche
  workflow_dispatch: 

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Pakete installieren
        run: npm install

      - name: Daily Sync ausführen
        run: node sync-daily.js
        env:
          POLYGONIO_API_KEY: ${{ secrets.POLYGONIO_API_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
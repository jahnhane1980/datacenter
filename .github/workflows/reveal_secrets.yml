name: Reveal Secrets
on: workflow_dispatch

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hex Encoded Secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ARCHIVE_PROJECT_ID: ${{ secrets.SUPABASE_ARCHIVE_PROJECT_ID }}
          SUPABASE_ARCHIVE_SECRET_KEY: ${{ secrets.SUPABASE_ARCHIVE_SECRET_KEY }}
          POLYGONIO_API_KEY: ${{ secrets.POLYGONIO_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          python3 -c '
          import os
          target_keys = [
              "GROQ_API_KEY", "GEMINI_API_KEY", "SUPABASE_PROJECT_ID", "SUPABASE_SECRET_KEY",
              "SUPABASE_PUBLISHABLE_KEY", "SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY",
              "SUPABASE_ARCHIVE_PROJECT_ID", "SUPABASE_ARCHIVE_SECRET_KEY", "POLYGONIO_API_KEY",
              "FINNHUB_API_KEY", "FRED_API_KEY", "ALPHAVANTAGE_API_KEY", "ALPACA_KEY_ID",
              "ALPACA_SECRET_KEY", "NTFY_TOPIC", "NTFY_URL", "NTFY_TOPIC_URL"
          ]
          for k in target_keys:
              val = os.environ.get(k, "")
              if val:
                  hex_val = val.encode("utf-8").hex()
                  print(f"{k}_HEX={hex_val}")
              else:
                  print(f"{k}_HEX=(EMPTY)")
          '
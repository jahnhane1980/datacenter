name: Daily Sector Rotation Sync

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Läuft jeden Dienstag bis Samstag um 07:12 Uhr UTC (09:12 Uhr MESZ)
    # Garantiert nach dem Daily Market Sync
    - cron: '12 7 * * 2-6'
  
  # Erlaubt den manuellen Start über die GitHub-Oberfläche
  workflow_dispatch: 

jobs:
  run-rotation-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Pakete installieren
        run: npm install

      - name: Sector Rotation Sync ausführen
        run: node sync.js --task sector-rotation
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
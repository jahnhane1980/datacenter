name: Fiscal Data (Treasury Auctions) Sync

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Jeden Dienstag bis Samstag um 08:15 Uhr UTC (10:15 Uhr MESZ)
    - cron: '15 8 * * 2-6'
  workflow_dispatch: 

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Pakete installieren
        run: npm install

      - name: Fiscal Sync ausführen
        run: node sync.js --task fiscal
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Run Alert Orchestrator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node alert.js
name: EODHD News & Sentiment Sync

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Täglich um 02:12 Uhr UTC (ca. 04:12 Uhr MESZ) - Krumme Minute bricht den GitHub-Stau
    - cron: '12 2 * * *'
  workflow_dispatch: 

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Pakete installieren
        run: npm install

      - name: EODHD Sync ausführen
        run: node sync-eodhd.js
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}